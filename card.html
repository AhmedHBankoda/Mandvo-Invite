<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Wedding Invitation</title> <style> body { margin: 0; font-family: Georgia, serif; background: #f7f1e8; color: #4a3928; text-align: center; } .card { max-width: 500px; min-height: 100vh; margin: auto; padding: 40px 25px; box-sizing: border-box; } h1 { font-size: 30px; letter-spacing: 2px; } .guest { font-size: 22px; margin: 30px 0; } button { border: none; padding: 14px 25px; margin: 8px; border-radius: 30px; cursor: pointer; font-size: 16px; } .yes { background: #8b6f47; color: white; } .no { background: #ddd; color: #333; } </style> </head> <body> <div class="card"> <h1>✨ WEDDING INVITATION ✨</h1> <p>We are delighted to invite you to</p> <h2>Ahmed's Wedding</h2> <p> Saturday, 17th October 2026<br> 6:00 PM onwards </p> <p> Aqeeq Hall<br> Zumerida, Salmiya </p> <div class="guest"> Salam, <span id="guestName">friend</span> 👋 </div> <p> Will you be joining us for this special celebration? </p> <button class="yes" onclick="selectRSVP('yes')"> ✨ Yes, we'll be there </button> <button class="no" onclick="selectRSVP('no')"> 😔 Sorry, can't make it </button> <br><br> <button onclick="sendRSVP()"> Send my RSVP </button> </div> <script> const params = new URLSearchParams(window.location.search); const name = params.get("name"); const number = params.get("n"); if (name) { document.getElementById("guestName").textContent = decodeURIComponent(name); } let response = ""; function selectRSVP(answer) { response = answer; if (answer === "yes") { alert("Thank you! We look forward to seeing you."); } else { alert("Thank you for letting us know."); } } function sendRSVP() { if (!response) { alert("Please select an RSVP option first."); return; } console.log({ name: name, invitees: number, response: response }); alert("Your RSVP has been recorded."); } </script> </body> </html>
